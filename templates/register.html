
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | SocietyFix</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            color: #1e293b;
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 34px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(37, 99, 235, 0.12);
        }

        .logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: #2563eb;
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: 27px;
        }

        .subtitle {
            margin: 10px 0 25px;
            text-align: center;
            color: #64748b;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px #dbeafe;
        }

        button {
            width: 100%;
            margin-top: 23px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: #1d4ed8; }

        .message {
            margin: 12px 0;
            padding: 11px;
            border-radius: 8px;
            font-size: 14px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .footer {
            margin-top: 22px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        .back {
            display: block;
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo">S</div>
        <h1>Create Account</h1>
        <p class="subtitle">
            Join SocietyFix to manage your society complaints easily.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <label for="name">Full Name</label>
            <input id="name" type="text" name="name"
                   placeholder="Enter your full name"
                   autocomplete="name" required>

            <label for="email">Email Address</label>
            <input id="email" type="email" name="email"
                   placeholder="you@example.com"
                   autocomplete="email" required>

            <label for="flat">Flat Number</label>
            <input id="flat" type="text" name="flat"
                   placeholder="e.g. A-101"
                   autocomplete="off" required>

            <label for="password">Password</label>
            <input id="password" type="password" name="password"
                   placeholder="At least 8 characters"
                   autocomplete="new-password"
                   minlength="8" required>

            <label for="confirm_password">Confirm Password</label>
            <input id="confirm_password" type="password"
                   name="confirm_password"
                   placeholder="Enter password again"
                   autocomplete="new-password"
                   minlength="8" required>

            <button type="submit">Create Account</button>
        </form>

        <p class="footer">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

        <a class="back" href="{{ url_for('login') }}">← Back to Login</a>
    </main>
</body>
</html>
