
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SocietyFix</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            margin: 0; min-height: 100vh; display: flex;
            align-items: center; justify-content: center;
            padding: 20px; background: #eff6ff; color: #1e293b;
        }
        .card {
            width: 100%; max-width: 440px; background: white;
            padding: 35px; border-radius: 16px;
            box-shadow: 0 10px 35px #1e293b12;
        }
        .logo { color: #2563eb; font-size: 26px; font-weight: bold; }
        h1 { margin: 24px 0 10px; font-size: 27px; }
        p { color: #64748b; line-height: 1.7; }
        label { display: block; margin: 20px 0 8px; font-weight: bold; }
        input {
            width: 100%; padding: 13px; border: 1px solid #cbd5e1;
            border-radius: 8px; font-size: 15px;
        }
        button {
            width: 100%; margin-top: 22px; padding: 14px;
            background: #2563eb; color: white; border: 0;
            border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        .message {
            padding: 11px; margin: 10px 0; border-radius: 8px;
            background: #fef2f2; color: #b91c1c; font-size: 14px;
        }
        .success { background: #f0fdf4; color: #166534; }
        .note { font-size: 12px; }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo">SocietyFix.</div>
        <h1>Create New Password</h1>
        <p>Choose a new password for your account.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('reset_password', token=token) }}">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password"
                   minlength="8" autocomplete="new-password"
                   placeholder="At least 8 characters" required>

            <label for="confirm_password">Confirm New Password</label>
            <input type="password" id="confirm_password"
                   name="confirm_password" minlength="8"
                   autocomplete="new-password"
                   placeholder="Enter password again" required>

            <button type="submit">Reset Password</button>
        </form>

        <p class="note">Your reset link expires after 15 minutes.</p>
    </main>
</body>
</html>
